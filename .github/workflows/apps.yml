name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apps
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - name: Icons and splash
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#1D6B58' --iconBackgroundColorDark '#0E1418' --splashBackgroundColor '#1D6B58' --splashBackgroundColorDark '#0E1418'
      - name: Set version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - run: npx cap sync android
      - name: Fixed signing key (updates install over the old app)
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk budget-buddy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: budget-buddy.apk

  ios:
    runs-on: macos-15-intel
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap add ios
      - name: Icon and splash
        run: |
          A=ios/App/App/Assets.xcassets
          cp assets/ios-icon.png $A/AppIcon.appiconset/AppIcon-512@2x.png
          for f in splash-2732x2732.png splash-2732x2732-1.png splash-2732x2732-2.png; do cp assets/splash.png $A/Splash.imageset/$f; done
      - name: Permissions text and version
        run: |
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Микрофон нужен, чтобы записывать траты голосом.'" $PL
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Распознавание речи превращает сказанное в записи о тратах.'" $PL
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Бюджет'" $PL || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Бюджет'" $PL
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PL
          # Номер сборки должен расти с каждой загрузкой в TestFlight, в том числе при перезапуске
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = 1.0.${{ github.run_number }};/g; s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }}.${{ github.run_attempt }};/g" ios/App/App.xcodeproj/project.pbxproj
      - run: npx cap sync ios
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          test -d build/Build/Products/Release-iphoneos/App.app
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry budget-buddy.ipa Payload
          ls -la budget-buddy.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: budget-buddy.ipa

      # Загрузка в TestFlight. Работает, когда в Secrets репозитория есть
      # APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID и ASC_KEY_P8 (текст ключа .p8).
      - name: TestFlight is not configured
        if: env.HAS_ASC != 'true'
        run: echo "::notice::Секреты App Store Connect не заданы, загрузка в TestFlight пропущена."
      - name: Archive signed app
        if: env.HAS_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Automatic; DEVELOPMENT_TEAM = $APPLE_TEAM_ID;/g" ios/App/App.xcodeproj/project.pbxproj
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -60
          test -d build/App.xcarchive
      - name: Upload to TestFlight
        if: env.HAS_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -60
          echo "::notice::Сборка 1.0.${{ github.run_number }} отправлена в App Store Connect. В TestFlight она появится после обработки Apple."
      - name: Remove key
        if: always()
        run: rm -rf ~/private_keys

  publish:
    needs: [android, ios]
    if: ${{ !cancelled() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* \
            --target "${{ github.sha }}" \
            --title "Голосовой бюджет 1.0.${{ github.run_number }}" \
            --notes "budget-buddy.ipa — для iPhone (ставится через Sideloadly или AltStore). budget-buddy.apk — для Android." \
            --latest
